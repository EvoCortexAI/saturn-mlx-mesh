name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: saturn-mlx-mesh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
